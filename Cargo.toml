[package]
name = "librpm"
version = "0.2.0-pre"
description = "RPM Package Manager library binding with an idiomatic Rust API"
license = "MPL-2.0"
authors = ["Tony Arcieri <tony@iqlusion.io>"]
categories = ["api-bindings", "os", "parsing"]
keywords = ["rpm", "linux", "redhat", "fedora", "centos"]
readme = "README.md"
homepage = "https://github.com/rpm-software-management/librpm.rs/"
documentation = "https://rustrpm.org/librpm/"
edition = "2024"
rust-version = "1.85"

[dependencies]
once_cell = "1.21"
librpm-sys = { version = "0.2.0-pre", path = "librpm-sys" }
streaming-iterator = "0.1.5"

[features]
test-current-system = []

default = []

[lints.rust]
# WARNING: this also silences typos in #[cfg(…)] attributes.
# build.rs sets has_rpmtag_* / has_rpmsigtag_* cfgs dynamically from DEP_RPM_*
# env vars, which vary by system RPM version and can't be enumerated statically.
unexpected_cfgs = "allow"

[workspace]
members = ["librpm-sys", "librpmbuild-sys", "librpmsign-sys"]
